name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# A cancelled deploy leaves the site on the previous build, so a queued one
# waits for the deploy in flight rather than replacing it.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      # Cloudflare's own builds carry Node, Python, Go, and Ruby and no Rust,
      # so the module is built here and `wrangler` only uploads the result.
      - name: Build the browser demo
        run: wasm-pack build web-demo --target web --out-dir www/pkg --release

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: web-demo
          command: deploy
