name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to build, such as v0.1.0
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tag names the release and the executables carry the version compiled
  # into them, so the two disagreeing is a mistake worth catching before three
  # runners spend a release build on it.
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve the tag and check it against the workspace version
        id: resolve
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "rssstv") | .version')"
          if [ "$TAG" != "v$version" ]; then
            echo "the tag $TAG does not match the workspace version $version" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Rendered once for every archive, unlike the license page: the manual is
      # the same text on all three platforms, and pandoc is a package the two
      # other runners would have to install to produce a byte-identical copy.
      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pandoc

      - name: Build the manual
        env:
          RSSSTV_VERSION: ${{ steps.resolve.outputs.tag }}
        run: bash docs/help/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: manual
          path: target/help
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libasound2-dev mold

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Build the release executable
        run: >
          cargo build --release --locked --target ${{ matrix.target }}
          -p rssstv

      # A dependency on the Visual C++ redistributable is the one thing an
      # archive cannot repair on the operator's machine, so the invariant is
      # checked rather than trusted: `RUSTFLAGS` in the environment replaces
      # the flag in `.cargo/config.toml` without a word about it.
      - name: Check that the Windows executable needs no C runtime DLL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $path = "target/${{ matrix.target }}/release/rssstv.exe"
          $bytes = [System.IO.File]::ReadAllBytes($path)
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          if ($text -match "VCRUNTIME140|api-ms-win-crt-") {
            throw "rssstv.exe links the C runtime dynamically"
          }

      # Generated on the platform being packaged rather than once for all
      # three: the dependency graph differs by target, so a page built on one
      # would omit what only another one links.
      - name: Generate the dependency license page
        run: cargo about generate about.hbs --output-file licenses.html

      - uses: actions/download-artifact@v4
        with:
          name: manual
          path: manual

      - name: Stage the archive contents
        if: runner.os != 'macOS'
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          name="rssstv-$TAG-$TARGET"
          root="staging/$name"
          mkdir -p "$root"
          if [ -f "target/$TARGET/release/rssstv.exe" ]; then
            cp "target/$TARGET/release/rssstv.exe" "$root/"
          else
            cp "target/$TARGET/release/rssstv" "$root/"
          fi
          cp LICENSE README.md licenses.html "$root/"
          cp -r manual "$root/help"
          cp -r templates "$root/"
          echo "ARCHIVE_NAME=$name" >> "$GITHUB_ENV"

      # A Wayland compositor has no way to learn the window icon from the
      # application, so the Linux archive has to carry the desktop entry the
      # compositor reads it from.
      - name: Add the desktop entry to the Linux archive
        if: runner.os == 'Linux'
        run: |
          mkdir -p "staging/$ARCHIVE_NAME/assets"
          cp rssstv/assets/rssstv.desktop rssstv/assets/icon.png \
            "staging/$ARCHIVE_NAME/assets/"

      # macOS gets a bundle in a disk image rather than an archive of bare
      # files: the bundle is what carries the icon and the microphone
      # permission text, and the image is what installs by drag and drop.
      - name: Build the application bundle and disk image
        if: runner.os == 'macOS'
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          name="rssstv-$TAG-$TARGET"
          bash package/build-app.sh \
            "target/$TARGET/release/rssstv" manual licenses.html "$name.dmg"
          echo "ARCHIVE_NAME=$name" >> "$GITHUB_ENV"

      - name: Create the tar archive
        if: runner.os == 'Linux'
        run: tar -czf "$ARCHIVE_NAME.tar.gz" -C staging "$ARCHIVE_NAME"

      - name: Create the zip archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "staging/$env:ARCHIVE_NAME" -DestinationPath "$env:ARCHIVE_NAME.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_NAME }}.*
          if-no-files-found: error

  release:
    name: Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: rssstv-*
          merge-multiple: true

      - name: Write the checksums and the release notes
        working-directory: artifacts
        run: |
          sha256sum rssstv-* > SHA256SUMS
          cat > notes.md <<'NOTES'
          Each download holds the `rssstv` application, this project's
          license, the licenses of its dependencies as `licenses.html`, the
          manual, and the MMSSTV templates ported to the KDL format.

          | Platform | Download |
          | --- | --- |
          | Windows x86_64 | `rssstv-TAG-x86_64-pc-windows-msvc.zip` |
          | Linux x86_64 | `rssstv-TAG-x86_64-unknown-linux-gnu.tar.gz` |
          | macOS Apple Silicon | `rssstv-TAG-aarch64-apple-darwin.dmg` |

          The macOS disk image installs by dragging `RSSSTV.app` into
          `Applications`. The bundle is ad-hoc signed rather than notarized,
          so open the first launch from the context menu, or clear the
          quarantine attribute:

          ```text
          xattr -dr com.apple.quarantine /Applications/RSSSTV.app
          ```

          The Linux archive carries `assets/rssstv.desktop` and
          `assets/icon.png`; installing both is what makes the window icon
          appear, as `README.md` describes.

          Downloads can be checked against `SHA256SUMS`.
          NOTES
          sed -i "s/TAG/$TAG/g" notes.md

      # A re-run of a tag that was already released replaces its archives
      # rather than failing, which is what a rebuild is for.
      - name: Publish the release
        working-directory: artifacts
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
            gh release upload "$TAG" rssstv-* SHA256SUMS --clobber
          else
            gh release create "$TAG" --verify-tag \
              --title "RSSSTV $TAG" --notes-file notes.md \
              rssstv-* SHA256SUMS
          fi
