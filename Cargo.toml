[workspace]
resolver = "3"
members = [
  "decode-wav",
  "encode-wav",
  "rssstv",
  "rssstv-audio",
  "rssstv-demodulator",
  "rssstv-dsp",
  "rssstv-fskid",
  "rssstv-modulator",
  "rssstv-rig",
  "rssstv-sstv",
  "rssstv-template",
  "web-demo",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "LGPL-3.0-or-later"
authors = ["Yū KOBAYASHI <kb10uy@kb10uy.org>"]
repository = "https://github.com/kb10uy/rssstv"

[workspace.dependencies]
anyhow = "1.0"
console_error_panic_hook = "0.1"
directories = "6.0"
eframe = "0.35"
embed-resource = "3.0"
egui = "0.35"
egui_extras = "0.35"
fontdb = "0.23"
egui_kittest = "0.35"
fluent-bundle = "0.16"
hound = "3.5"
muda = { version = "0.19", default-features = false }
raw-window-handle = "0.6"
jiff = "0.2"
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png", "webp"] }
image-webp = "0.2"
kdl = "6.7"
libm = "0.2"
# Lua is built from its own vendored C sources: it is a few dozen files of
# portable C with no configure step and no external dependencies, which is a
# different proposition from linking Hamlib and is why the rig is scripted
# rather than driven by a fixed set of commands.
mlua = { version = "0.11", features = ["lua54", "vendored"] }
proptest = "1.7"
png = "0.18"
resvg = "0.47"
rstest = "0.26"
thiserror = { version = "2.0", default-features = false }
toml_edit = "0.25"
unic-langid = "0.9"
wasm-bindgen = "0.2"
windows-sys = "0.61"

# Panics keep unwinding: the receive and transmit workers are separate threads whose failure is reported to the interface,
# and aborting would take the whole session down with one of them.
[profile.release]
lto = true
strip = true
panic = "unwind"
