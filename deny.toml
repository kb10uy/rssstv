[licenses]
confidence-threshold = 0.8
allow = [
    "LGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
exceptions = [
    { allow = ["MPL-2.0"], crate = "option-ext" }, # No Exhibit B
]

[advisories]
ignore = [
    # ttf-parser
    "RUSTSEC-2026-0192",
    # rustybuzz
    "RUSTSEC-2026-0206",
]
