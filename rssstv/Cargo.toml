[package]
name = "rssstv"
description = "SSTV for amateur radio"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
directories.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
fluent-bundle.workspace = true
fontdb.workspace = true
image.workspace = true
image-webp.workspace = true
jiff.workspace = true
mlua.workspace = true
rssstv-audio = { path = "../rssstv-audio" }
rssstv-demodulator = { path = "../rssstv-demodulator" }
rssstv-dsp = { path = "../rssstv-dsp" }
rssstv-fskid = { path = "../rssstv-fskid" }
rssstv-modulator = { path = "../rssstv-modulator" }
rssstv-rig = { path = "../rssstv-rig" }
rssstv-sstv = { path = "../rssstv-sstv", features = ["std"] }
rssstv-template = { path = "../rssstv-template" }
png.workspace = true
thiserror.workspace = true
toml_edit.workspace = true
unic-langid.workspace = true

# muda drives the platform menu bar, which needs a native window handle it can
# own. Linux is left out on purpose: muda only attaches to gtk windows there,
# and winit does not create one, so Linux uses the in-window menu bar instead.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
muda.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Gated on the host rather than the target, which is what Cargo matches build
# dependencies against; `build.rs` uses the same condition so the two agree.
[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
hound.workspace = true
rstest.workspace = true

# `cargo deb -p rssstv` builds the Debian package from this. The manual under
# target/help has to be rendered first; package/build-deb.sh does both in
# order. Asset sources are relative to this directory, except target/release/
# paths, which cargo-deb resolves against the workspace target directory.
[package.metadata.deb]
name = "rssstv"
section = "hamradio"
priority = "optional"
license-file = ["../LICENSE", "0"]
extended-description = """\
Slow-scan television for amateur radio: receives and decodes SSTV \
transmissions from a capture device, and composes and transmits pictures \
from KDL templates, with optional rig control through Hamlib's rigctld. \
The operator's manual is installed under /usr/share/doc/rssstv/help."""
# $auto covers what the binary links (glibc, ALSA, gcc-s); the graphics and
# keyboard libraries are dlopen'd at runtime, which dpkg-shlibdeps cannot see,
# so they are named explicitly.
depends = ["$auto", "libxkbcommon0", "libxkbcommon-x11-0", "libegl1", "libgl1"]
recommends = ["xdg-utils", "fonts-noto-cjk"]
suggests = ["fonts-dejavu-core"]
assets = [
    ["target/release/rssstv", "usr/bin/", "755"],
    ["assets/rssstv.desktop", "usr/share/applications/", "644"],
    ["assets/icon.png", "usr/share/icons/hicolor/512x512/apps/rssstv.png", "644"],
    ["../target/help/*", "usr/share/doc/rssstv/help/", "644"],
]
