[package]
name = "rssstv"
description = "SSTV for amateur radio"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
directories.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
fluent-bundle.workspace = true
fontdb.workspace = true
image.workspace = true
rssstv-audio = { path = "../rssstv-audio" }
rssstv-demodulator = { path = "../rssstv-demodulator" }
rssstv-fskid = { path = "../rssstv-fskid" }
rssstv-modulator = { path = "../rssstv-modulator" }
rssstv-sstv = { path = "../rssstv-sstv", features = ["std"] }
rssstv-template = { path = "../rssstv-template" }
toml_edit.workspace = true
unic-langid.workspace = true

# muda drives the platform menu bar, which needs a native window handle it can
# own. Linux is left out on purpose: muda only attaches to gtk windows there,
# and winit does not create one, so Linux uses the in-window menu bar instead.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
muda.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Gated on the host rather than the target, which is what Cargo matches build
# dependencies against; `build.rs` uses the same condition so the two agree.
[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
hound.workspace = true
rstest.workspace = true
