# The band plan RSSSTV starts with.
#
# This is what runs when no bands.toml has been written beside config.toml.
# Copy it there to change it: band plans are regional, and the frequencies
# below are conventions rather than allocations. What may be transmitted where
# is your licence, not this file.
#
# The application reads `name`, `low`, and `high` to say which band a frequency
# is on, and `step` to move by. Everything else is passed to rigcontrol.lua
# untouched, so a key of your own — an antenna, an amplifier setting — reaches
# the script beside these. Hyphens become underscores on the way: a
# `receive-mode` here is `band.receive_mode` there.

[[bands]]
name = "80m"
low = 3_500_000
high = 4_000_000
target = 3_845_000
transmit-mode = "PKTLSB"
receive-mode = "LSB"
bandwidth = 3_000
step = 3_000

